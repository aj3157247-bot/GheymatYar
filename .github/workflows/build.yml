name: Build GheymatYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5 \
            libncurses5-dev

      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.36

      - name: Install Python dependencies
        run: |
          python -m pip install arabic-reshaper==3.0.0
          python -m pip install python-bidi==0.6.6

      - name: Build APK
        run: |
          buildozer android debug

      - name: Show APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GheymatYar-APK
          path: bin/*.apk
          if-no-files-found: error
