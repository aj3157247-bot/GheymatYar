name: Build GheymatYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Python
      # ==========================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      # ==========================================================
      # Java 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # System dependencies
      # ==========================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            build-essential

      # ==========================================================
      # Verify environment
      # ==========================================================

      - name: Check environment
        run: |
          python --version
          pip --version
          java -version
          javac -version

      # ==========================================================
      # Install Buildozer
      # ==========================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36

      # ==========================================================
      # IMPORTANT:
      # Do NOT install requirements.txt with pip here.
      #
      # Buildozer/p4a handles Android requirements itself.
      # Installing requests/charset-normalizer manually can
      # reintroduce the broken Android wheel.
      # ==========================================================

      - name: Verify project files
        run: |
          test -f buildozer.spec
          test -f requirements.txt
          test -f main.py

          echo "===== requirements.txt ====="
          cat requirements.txt

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      # ==========================================================
      # Remove old build data
      #
      # This is important so the broken charset_normalizer wheel
      # from the previous build cannot be reused.
      # ==========================================================

      - name: Clean old Buildozer data
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer/cache

      # ==========================================================
      # Build APK
      # ==========================================================

      - name: Build Android APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          buildozer android debug

      # ==========================================================
      # Show generated APK
      # ==========================================================

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print

      # ==========================================================
      # Upload APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GheymatYar-APK
          path: bin/*.apk
          if-no-files-found: error

      # ==========================================================
      # Upload build log if build fails
      # ==========================================================

      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GheymatYar-Build-Logs
          path: |
            .buildozer/**/*.log
            ~/.buildozer/**/*.log
          if-no-files-found: warn
