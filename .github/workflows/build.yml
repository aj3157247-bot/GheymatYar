name: Build GheymatYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5 \
            libncurses5-dev

      - name: Install Build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.36
          python -m pip install arabic-reshaper==3.0.0
          python -m pip install python-bidi==0.6.6

      - name: Show environment
        run: |
          python --version
          pip --version
          buildozer --version
          cython --version
          java -version

      - name: Build APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Create diagnostic package
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostic

          cp build.log diagnostic/build.log

          python --version > diagnostic/environment.txt 2>&1
          pip --version >> diagnostic/environment.txt 2>&1
          buildozer --version >> diagnostic/environment.txt 2>&1
          cython --version >> diagnostic/environment.txt 2>&1
          java -version >> diagnostic/environment.txt 2>&1

          echo "" >> diagnostic/environment.txt
          echo "========== BUILD RESULT ==========" >> diagnostic/environment.txt
          echo "${{ steps.build.outcome }}" >> diagnostic/environment.txt

          echo "" >> diagnostic/environment.txt
          echo "========== PROJECT FILES ==========" >> diagnostic/environment.txt
          find . -maxdepth 4 \
            -type f \
            ! -path "./.buildozer/*" \
            ! -path "./.git/*" \
            >> diagnostic/environment.txt

          zip -r GheymatYar-Diagnostic.zip diagnostic

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GheymatYar-Diagnostic
          path: GheymatYar-Diagnostic.zip
          if-no-files-found: error

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GheymatYar-APK
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "APK build failed."
          echo "Download GheymatYar-Diagnostic artifact."
          exit 1
